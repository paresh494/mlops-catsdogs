apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml

# The CD pipeline runs:
#   kustomize edit set image ghcr.io/OWNER/mlops-catsdogs=ghcr.io/<owner>/mlops-catsdogs:<sha>
images:
  - name: ghcr.io/OWNER/mlops-catsdogs
    newName: ghcr.io/OWNER/mlops-catsdogs
    newTag: latest
