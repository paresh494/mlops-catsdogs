[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-catsdogs"
version = "0.1.0"
description = "End-to-end MLOps pipeline for Cats vs Dogs binary image classification"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

# pytest configuration lives in pytest.ini

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["mlruns", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
