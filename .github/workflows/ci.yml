name: CI

# M3: on every push / PR -> checkout, install deps, run unit tests, build image,
# and (on main) publish the image to GitHub Container Registry.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ github.repository }}          # owner/repo -> ghcr image path
  REGISTRY: ghcr.io

jobs:
  test:
    name: Lint & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.9.0
          pip install -r requirements-dev.txt
          pip install --no-deps -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Run unit tests
        run: pytest --cov=mlops_catsdogs --cov=app --cov-report=term-missing --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  build-image:
    name: Build (and push) Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single-arch: matches the GitHub runner and the CD / deploy targets.
          # On Apple Silicon, pull/run with `--platform linux/amd64`.
          platforms: linux/amd64
          # Push only on real pushes to the repo (not PRs from forks).
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Post-build image smoke test
        if: github.event_name == 'pull_request'
        run: |
          docker build -t catsdogs:pr .
          docker run -d --name catsdogs -p 8000:8000 catsdogs:pr
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break || sleep 2; done
          bash scripts/smoke_test.sh http://localhost:8000
          docker rm -f catsdogs
